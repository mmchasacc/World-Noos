<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World GeoPol - System Access</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-container">
    
    <div class="panel auth-panel">
        
        <header class="auth-header">
            <h1 class="auth-title">System Access</h1>
            <p class="auth-subtitle">Logga in eller skapa ett konto för att utföra ändringar</p>
        </header>

        <div id="authSection">
            <div id="authForms">
                <div class="auth-tabs">
                    <button onclick="toggleAuthMode('login')" id="loginTab" class="auth-tab active">Logga in</button>
                    <button onclick="toggleAuthMode('register')" id="registerTab" class="auth-tab">Skapa konto</button>
                </div>
                
                <form id="authForm">
                    <div class="form-group">
                        <label class="form-label">Användarnamn</label>
                        <input type="text" id="authUsername" placeholder="Namn" required class="form-control">
                    </div>
                    <div class="form-group mb-6">
                        <label class="form-label">Lösenord</label>
                        <input type="password" id="authPassword" placeholder="••••••••" required class="form-control">
                    </div>
                    
                    <button type="submit" id="authSubmitBtn" class="btn btn-primary">
                        Logga in
                    </button>
                </form>
            </div>

            <div id="userInfo" class="hidden text-center">
                <p class="mb-4 text-secondary">Din session har gått ut som <b id="currentUserName" style="color: var(--text-primary);"></b></p>
                <button onclick="logout()" class="btn btn-secondary" style="width: 100%;">Logga ut / Logga in igen</button>
            </div>
        </div>

        <footer class="auth-footer">
            <a href="index.html" class="auth-link">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                Avbryt och gå tillbaka
            </a>
        </footer>
    </div>

    <script>
        let authMode = 'login';

        function toggleAuthMode(mode) {
            authMode = mode;
            const btn = document.getElementById('authSubmitBtn');
            const loginTab = document.getElementById('loginTab');
            const registerTab = document.getElementById('registerTab');

            if (mode === 'login') {
                btn.innerText = 'Logga in';
                loginTab.classList.add('active');
                registerTab.classList.remove('active');
            } else {
                btn.innerText = 'Skapa konto';
                registerTab.classList.add('active');
                loginTab.classList.remove('active');
            }
        }

        document.getElementById('authForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('authUsername').value;
            const password = document.getElementById('authPassword').value;
            const endpoint = authMode === 'login' ? '/api/auth/login' : '/api/auth/register';

            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Något gick fel');

                if (authMode === 'login') {
                    localStorage.setItem('accessToken', data.accessToken);
                    localStorage.setItem('refreshToken', data.refreshToken)
                    localStorage.setItem('username', username);

                    window.location.href = 'index.html'; 
                } else {
                    alert("Konto skapat! Logga in nu.");
                    toggleAuthMode('login');
                    document.getElementById('authPassword').value = '';
                }
            } catch (err) {
                alert(err.message);
            }
        });

        function updateAuthUI() {
            const token = localStorage.getItem('accessToken');
            const username = localStorage.getItem('username');
            const authForms = document.getElementById('authForms');
            const userInfo = document.getElementById('userInfo');

            if (token) {
                authForms.classList.add('hidden');
                userInfo.classList.remove('hidden');
                document.getElementById('currentUserName').innerText = username;
            } else {
                authForms.classList.remove('hidden');
                userInfo.classList.add('hidden');
            }
        }

        function logout() {
            localStorage.removeItem('accessToken');
            localStorage.removeItem('refreshToken');
            localStorage.removeItem('username');
            updateAuthUI();
        }

        updateAuthUI();
    </script>
</body>
</html>
